<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessibility tools audit test - Readable text block - GDS accessibility team</title>
  <script src="../assets/javascript/jquery.min.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <link rel="stylesheet" href="../assets/stylesheets/tests.css" />

<body>
  <h1>Readable text block</h1>
  <main>
    <div style="max-width: 38em; line-height: 1.5;"><p style="max-width: 34em; line-height: 1.6; font-size: 19px;">Many people find it easier to read text when lines are short and well spaced. This paragraph is left aligned, uses regular letters and has space between the lines, so it is easy to follow from one line to the next.</p></div>
  </main>
