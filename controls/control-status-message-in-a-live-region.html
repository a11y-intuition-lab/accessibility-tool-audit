<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessibility tools audit test - Status message in a live region - GDS accessibility team</title>
  <script src="../assets/javascript/jquery.min.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <link rel="stylesheet" href="../assets/stylesheets/tests.css" />
</head>
<body>
  <h1>Status message in a live region</h1>
  <main>
    <div style="max-width: 38em; line-height: 1.5;"><p><button type="button" id="add">Add to basket</button></p>
<p role="status" id="basket-status"></p>
<script>
document.getElementById('add').addEventListener('click', function () {
  document.getElementById('basket-status').textContent = '1 item added to your basket.';
});
</script></div>
  </main>
</body>
</html>
