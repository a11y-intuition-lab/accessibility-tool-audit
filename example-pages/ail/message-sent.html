<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A11y Intuition Lab (ail-2026) example page for the test case forms-data-submission-without-confirmation-ail.
     Barrier (3.3.6): the message was sent as soon as the form was submitted. There was no review step, no confirmation and it cannot be withdrawn. -->
<title>Message sent - Contact the recycling team - Example Council</title>
<style>
body { font-family: sans-serif; line-height: 1.5; margin: 1em; color: #0b0c0c; background: #ffffff; }
header, footer { border-color: #0b0c0c; border-style: solid; border-width: 0; }
header { border-bottom-width: 2px; margin: 0 0 1em 0; }
footer { border-top-width: 2px; margin: 2em 0 0 0; }
nav ul, footer ul { padding-left: 1.25em; }
li { margin: 0 0 0.5em 0; }
a[aria-current="page"] { color: #0b0c0c; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>
<header>
<p>Example Council</p>
</header>
<main>
<h1>Message sent</h1>
<p>Your message has been sent to the recycling team.</p>
<p>You cannot change or withdraw a message after it has been sent.</p>
</main>
<footer>
<p>Example Council is a fictional council used in accessibility test pages.</p>
</footer>
</body>
</html>
