<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <h1>Payment is taken without a chance to check or cancel</h1>
  <main>
    <form action="paid.html">
  <p>Amount to pay: £120.00</p>
  <label for="card-number">Card number</label>
  <input id="card-number" type="text" autocomplete="cc-number"/>

</form>
