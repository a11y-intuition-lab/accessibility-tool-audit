<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessibility tools audit test - Motion animation triggered by interaction cannot be turned off - GDS accessibility team</title>
  <script src="../assets/javascript/jquery.min.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <link rel="stylesheet" href="../assets/stylesheets/tests.css" />
</head>
<body>
  <h1>Motion animation triggered by interaction cannot be turned off</h1>
  <main>
    <p><button type="button" class="interaction-animation-start">Add to basket</button></p>
<div class="interaction-animation">Basket</div>
<p>The basket spins and slides across the page when an item is added, even when the user has asked for reduced motion.</p>
  </main>
</body>
