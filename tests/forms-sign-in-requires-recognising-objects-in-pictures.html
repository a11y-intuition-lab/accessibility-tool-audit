<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessibility tools audit test - Sign in requires recognising objects in pictures - GDS accessibility team</title>
  <script src="../assets/javascript/jquery.min.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <link rel="stylesheet" href="../assets/stylesheets/tests.css" />
</head>
<body>
  <h1>Sign in requires recognising objects in pictures</h1>
  <main>
    <fieldset>
  <legend>To sign in, select every picture of a red panda</legend>
  <label><input type="checkbox" name="captcha" value="1"/> <img src="../assets/test_images/red_panda.jpg" alt="Picture 1" width="120"/></label>
  <label><input type="checkbox" name="captcha" value="2"/> <img src="../assets/test_images/bat.jpg" alt="Picture 2" width="120"/></label>
</fieldset>
  </main>
</body>
</html>
