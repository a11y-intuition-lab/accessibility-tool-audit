<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accessibility tools audit test - Task has a time limit - GDS accessibility team</title>
  <script src="../assets/javascript/jquery.min.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <link rel="stylesheet" href="../assets/stylesheets/tests.css" />
</head>
<body>
  <h1>Task has a time limit</h1>
  <main>
    <form class="time-limit">
  <p>You have <span class="time-limit-seconds">60</span> seconds to answer.</p>
  <label for="time-limit-answer">What is the capital of Scotland?</label>
  <input id="time-limit-answer" type="text"/>
  <button type="submit">Submit answer</button>
</form>
  </main>
</body>
</html>
